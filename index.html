<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation With Keyframes </title>
  <style>
body {
  padding: 0;
  margin: 0;
  background: hwb(0 100% 0%);
  font-family: Arial, Roboto, system-ui, monospace, sans-serif;
  
}

.box {
  width: 100px;
  height: 100px;
  background: #7c3aed;
  animation: moveBox 2s ;
animation-direction: alternate;
  animation-timing-function: ease-in-out;
  animation-delay: 1s;
  animation-fill-mode: both;
  animation-iteration-count: 3;
}

  @keyframes moveBox {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(200px);
  }
  }
      @keyframes loding {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(200px);
  }
      }

    .loding {
  width: 100px;
  height: 100px;
  background: #7c3aed;
  animation: moveloding 2s infinite;
animation-direction: alternate;
  animation-timing-function: ease-in-out;
  animation-delay: 1s;
  animation-fill-mode: both;
  animation-iteration-count: 3;
    }
    
  </style>
  
  </head>
   <body>
     

     
    <div class="box"></div>

     <div class="Loding ..."></div>

</body>
</html>
